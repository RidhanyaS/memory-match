<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match</title>
<style>
  :root {
    --bg: #def0fc;
    --ink: #1d3a52;
    --muted: #5b7f9a;
    --back: #89cff0;
    --btn-ink: #12324a;
    --face: #ffffff;
    --good: #3fbf9f;
    --bad: #f27a93;
    --panel: #f7fbff;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f2233;
      --ink: #e6f4fd;
      --muted: #8fb5d0;
      --back: #5fb4de;
      --btn-ink: #0b1f2f;
      --face: #17344b;
      --panel: #153047;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { margin: 0 0 20px; color: var(--muted); }

  .bar {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--panel); border-radius: 12px; padding: 8px 16px;
    min-width: 86px; text-align: center;
  }
  .stat b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .8rem; color: var(--muted); }

  select, .btn {
    font: inherit; color: inherit;
    background: var(--panel); border: 2px solid transparent;
    border-radius: 12px; padding: 10px 16px; cursor: pointer;
  }
  .btn { background: var(--back); color: var(--btn-ink); font-weight: 600; }
  .btn:hover { filter: brightness(1.06); }
  :focus-visible { outline: 3px solid var(--good); outline-offset: 2px; }

  #board {
    --cols: 4;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: clamp(8px, 2vw, 14px);
    width: min(100%, 560px);
  }
  .tile {
    aspect-ratio: 1; padding: 0; border: 0; background: none;
    perspective: 600px; cursor: pointer;
  }
  .inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .4s;
    display: block;
  }
  .tile.up .inner, .tile.done .inner { transform: rotateY(180deg); }
  .side {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .back {
    background: var(--back);
    background-image: radial-gradient(circle at 30% 25%, rgba(255,255,255,.45), transparent 55%);
  }
  .back::after {
    content: ""; width: 28%; aspect-ratio: 1;
    border: 3px solid rgba(255,255,255,.7); border-radius: 50%;
  }
  .front {
    background: var(--face);
    transform: rotateY(180deg);
    font-size: clamp(1.6rem, 8vw, 3rem);
    border: 3px solid transparent;
  }
  .tile.done .front { border-color: var(--good); }
  .tile.miss .front { border-color: var(--bad); }
  .tile.done { cursor: default; }

  dialog {
    border: 0; border-radius: 18px; padding: 28px 32px;
    background: var(--panel); color: var(--ink); text-align: center;
    max-width: 340px;
  }
  dialog::backdrop { background: rgba(15, 40, 65, .5); }
  dialog h2 { margin: 0 0 8px; }
  dialog p { margin: 4px 0; }

  @media (prefers-reduced-motion: reduce) {
    .inner { transition: none; }
  }
</style>
</head>
<body>
  <h1>Memory Match</h1>
  <p class="sub">Flip two tiles at a time. Find every pair in the fewest moves.</p>

  <div class="bar">
    <select id="size" aria-label="Grid size">
      <option value="3x4">Easy (3 × 4)</option>
      <option value="4x4" selected>Medium (4 × 4)</option>
      <option value="4x5">Hard (4 × 5)</option>
      <option value="6x6">Expert (6 × 6)</option>
    </select>
    <div class="stat"><b id="moves">0</b><span>Moves</span></div>
    <div class="stat"><b id="time">0:00</b><span>Time</span></div>
    <div class="stat"><b id="best">–</b><span>Best moves</span></div>
    <button class="btn" id="restart">New game</button>
  </div>

  <div id="board" role="group" aria-label="Memory tiles"></div>

  <dialog id="win">
    <h2>You matched them all!</h2>
    <p id="winText"></p>
    <p id="winBest"></p>
    <p><button class="btn" id="again">Play again</button></p>
  </dialog>

<script>
(() => {
  const SYMBOLS = ["🦊","🐙","🌵","🍉","🚀","🎸","🦋","🍄","🌙","🔥","🐳","🍩","⚡","🎲","🦉","🍀","🧊","🪁"];

  const $ = (id) => document.getElementById(id);
  const board = $("board"), sizeSel = $("size");
  const movesEl = $("moves"), timeEl = $("time"), bestEl = $("best");
  const win = $("win");

  let first = null, lock = false, moves = 0, pairsLeft = 0;
  let seconds = 0, timer = null;

  const keyFor = () => "memory-best-" + sizeSel.value;

  function getBest() {
    try { return Number(localStorage.getItem(keyFor())) || null; }
    catch (e) { return null; }
  }
  function saveBest(n) {
    try { localStorage.setItem(keyFor(), String(n)); } catch (e) {}
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  const fmt = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

  function startTimer() {
    if (timer) return;
    timer = setInterval(() => { seconds++; timeEl.textContent = fmt(seconds); }, 1000);
  }
  function stopTimer() { clearInterval(timer); timer = null; }

  function newGame() {
    stopTimer();
    const [rows, cols] = sizeSel.value.split("x").map(Number);
    const pairs = (rows * cols) / 2;
    const deck = shuffle([...SYMBOLS].slice(0, pairs).flatMap((s) => [s, s]));
    shuffle(deck);

    first = null; lock = false; moves = 0; seconds = 0; pairsLeft = pairs;
    movesEl.textContent = "0";
    timeEl.textContent = "0:00";
    bestEl.textContent = getBest() ?? "–";

    board.style.setProperty("--cols", cols);
    board.innerHTML = "";
    deck.forEach((sym, i) => {
      const t = document.createElement("button");
      t.className = "tile";
      t.dataset.sym = sym;
      t.setAttribute("aria-label", "Hidden tile " + (i + 1));
      t.innerHTML = '<span class="inner"><span class="side back"></span><span class="side front">' + sym + "</span></span>";
      t.addEventListener("click", () => flip(t));
      board.appendChild(t);
    });
  }

  function flip(tile) {
    if (lock || tile.classList.contains("up") || tile.classList.contains("done")) return;
    startTimer();
    tile.classList.add("up");
    tile.setAttribute("aria-label", "Tile showing " + tile.dataset.sym);

    if (!first) { first = tile; return; }

    moves++;
    movesEl.textContent = moves;
    const a = first, b = tile;
    first = null;

    if (a.dataset.sym === b.dataset.sym) {
      [a, b].forEach((t) => { t.classList.remove("up"); t.classList.add("done"); t.disabled = true; });
      if (--pairsLeft === 0) finish();
    } else {
      lock = true;
      [a, b].forEach((t) => t.classList.add("miss"));
      setTimeout(() => {
        [a, b].forEach((t) => {
          t.classList.remove("up", "miss");
          t.setAttribute("aria-label", "Hidden tile");
        });
        lock = false;
      }, 900);
    }
  }

  function finish() {
    stopTimer();
    const best = getBest();
    let msg;
    if (!best || moves < best) { saveBest(moves); bestEl.textContent = moves; msg = "New best for this size!"; }
    else msg = "Best for this size: " + best + " moves.";
    $("winText").textContent = moves + " moves in " + fmt(seconds) + ".";
    $("winBest").textContent = msg;
    setTimeout(() => win.showModal(), 500);
  }

  $("restart").addEventListener("click", newGame);
  $("again").addEventListener("click", () => { win.close(); newGame(); });
  sizeSel.addEventListener("change", newGame);

  newGame();
})();
</script>
</body>
</html>
